version: "3"

tasks:
  tools:install:
    desc: Install dev tools (cargo-watch); safe to re-run
    cmds:
      - cargo install cargo-watch

  fe:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - pnpm install

  fe:build:
    desc: Build the React SPA into frontend/dist
    dir: frontend
    sources:
      - src/**/*
      - package.json
    generates:
      - dist/**/*
    cmds:
      - pnpm build

  build:
    desc: Build the release binary (build.rs rebuilds the web UI when stale)
    cmds:
      - cargo build --release

  dev:
    desc: Full dev loop — Vite HMR (:5173) + backend rebuild/restart (:8730)
    deps: [dev:frontend, dev:backend]

  dev:backend:
    desc: Rebuild & gracefully restart the backend on Rust changes (:8730)
    env:
      SM_SKIP_WEB_BUILD: "1"
    preconditions:
      - sh: command -v cargo-watch >/dev/null
        msg: "cargo-watch not found — run `task tools:install` first"
    cmds:
      - cargo watch --ignore frontend -x "run -p services-manager-server {{.CLI_ARGS}}"

  dev:frontend:
    desc: Vite dev server with HMR (:5173, proxies /api to :8730)
    dir: frontend
    cmds:
      - pnpm dev
